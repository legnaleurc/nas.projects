# Resolve these names to the NAS on the LAN.
# Since dnsmasq 2.86, address= only answers the matching record type (A here);
# local= keeps every other type (e.g. AAAA) local with an empty NOERROR answer
# instead of forwarding it upstream, where it would leak the public record.
address=/app.example.com/192.168.0.100
local=/app.example.com/
